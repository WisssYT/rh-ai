[project]
name = "talent-detective"
version = "0.1.0"
description = "Talent Detective - human-approved AI HR screening and scheduling prototype (hackathon, fictional data only)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.162.0",
  "uvicorn[standard]>=0.54.0",
  "sqlalchemy>=2.1.6",
  "alembic>=1.20.1",
  "psycopg[binary]>=3.3.6",
  "pydantic>=2.14.2",
  "pydantic-settings>=2.16.2",
  "argon2-cffi>=25.1.0",
  "google-genai>=2.34.0",
  "pypdf>=6.21.4",
  "python-multipart>=0.0.33",
  "reportlab>=5.1.0",
  "tzdata>=2025.2",
]

[dependency-groups]
dev = ["pytest>=9.2.0", "httpx>=0.28.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
